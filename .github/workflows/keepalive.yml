name: Manter servidor acordado

# O Render gratuito dorme após 15 min sem tráfego e leva ~1 min para voltar.
# Um ping a cada 10 min mantém um único serviço acordado dentro das 750 h/mês grátis.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://fcm-server-oe8u.onrender.com/health
